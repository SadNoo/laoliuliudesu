[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laoliuliu"
version = "0.1.0"
description = "Web-based 2026 Macau draw transition analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18,<1.19",
    "argon2-cffi>=25.1,<26",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black>=24.4,<26",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
laoliuliu-api = "laoliuliu.main:run"
laoliuliu-admin = "laoliuliu.cli:entrypoint"
laoliuliu-scheduler = "laoliuliu.scheduler:entrypoint"

[tool.setuptools.packages.find]
include = ["laoliuliu*"]

[tool.setuptools.package-data]
"laoliuliu.web" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
allowed-confusables = ["，", "；"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["laoliuliu"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires an isolated PostgreSQL database",
]
