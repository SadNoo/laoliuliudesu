services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laoliuliu}
      POSTGRES_USER: ${POSTGRES_USER:-laoliuliu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - laoliuliu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    profiles: ["tools"]
    environment: &app_environment
      LAOLIULIU_ENV: ${LAOLIULIU_ENV:-production}
      LAOLIULIU_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-laoliuliu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-laoliuliu}
      LAOLIULIU_SESSION_PEPPER: ${LAOLIULIU_SESSION_PEPPER:?Set LAOLIULIU_SESSION_PEPPER}
      LAOLIULIU_AI_ENCRYPTION_KEY: ${LAOLIULIU_AI_ENCRYPTION_KEY:?Set LAOLIULIU_AI_ENCRYPTION_KEY}
      LAOLIULIU_SESSION_COOKIE_SECURE: ${LAOLIULIU_SESSION_COOKIE_SECURE:-true}
      LAOLIULIU_PUBLIC_ORIGIN: ${LAOLIULIU_PUBLIC_ORIGIN:-https://lhc-api.1151156.xyz}
      LAOLIULIU_TIMEZONE: Asia/Hong_Kong
      LAOLIULIU_DATA_YEAR: "2026"
      LAOLIULIU_DATA_START_ISSUE: "48"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  scheduler:
    build: .
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "laoliuliu.scheduler"]

  admin:
    build: .
    profiles: ["tools"]
    user: "0:0"
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "laoliuliu.cli"]
    volumes:
      - ./deploy/credentials:/run/credentials
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      LAOLIULIU_DOMAIN: ${LAOLIULIU_DOMAIN:-lhc-api.1151156.xyz}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - laoliuliu_caddy_data:/data
      - laoliuliu_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  laoliuliu_postgres_data:
  laoliuliu_caddy_data:
  laoliuliu_caddy_config:
